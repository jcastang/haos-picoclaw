server {
    listen 8099;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Only the Home Assistant Supervisor Ingress proxy may connect.
    allow 172.30.32.2;
    deny all;

    client_max_body_size 32m;

    location / {
        # Ingress normally strips its public URL prefix before forwarding.
        # Retain compatibility if a prefixed request reaches this server.
        rewrite ^/api/hassio_ingress/[^/]+/?(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # The Launcher redirects unauthenticated GET / to /launcher-login.
        # A root-relative Location would escape the Home Assistant Ingress
        # session and produce an immediate Home Assistant 404.
        # Supervisor supplies the public session prefix in X-Ingress-Path.
        proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;

        # Keep Launcher session cookies scoped to the Ingress session.
        proxy_cookie_path / "$http_x_ingress_path/";
    }
}
