map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8099;
    server_name _;
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Diagnostic: accept connections on the internal Ingress listener.
    # This port is not published to the host.
    client_max_body_size 32m;
    # Never expose the add-on's internal port in redirects.
    absolute_redirect off;

    # Diagnostic endpoint served by NGINX itself, never forwarded to PicoClaw.
    location = /ingress-status {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-PicoClaw-Proxy-Test "nginx-direct" always;
        return 200 "NGINX OK - PicoClaw Ingress diagnostic v0.1.15\n";
    }

    location = /ingress-test.html {
        default_type text/html;
        alias /usr/share/nginx/html/ingress-test.html;
        add_header Cache-Control "no-store" always;
        add_header X-PicoClaw-Proxy-Test "nginx-direct" always;
    }

    location / {
        # Supervisor strips the Ingress URL prefix before forwarding.
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Match absolute upstream redirects as well as root-relative ones.
        # Explicitly preserve the Home Assistant Ingress prefix.
        # Relative Location avoids leaking the add-on's internal :8099 origin.
        # The entrypoint URL ends in /, so "launcher-login" resolves inside Ingress.
        proxy_redirect "~^https?://[^/]+/launcher-login([?#].*)?$" "launcher-login$1";
        proxy_redirect "~^/launcher-login([?#].*)?$" "launcher-login$1";
        proxy_redirect ~^https?://[^/]+/(.*)$ $1;
        proxy_redirect ~^/(.*)$ $1;
        proxy_cookie_path / "$http_x_ingress_path/";

        # Rewrite root-relative Launcher frontend URLs in uncompressed HTML/JS.
        # Explicitly prevent Brotli/gzip on the Launcher-to-NGINX hop.        
        proxy_set_header Accept-Encoding "identity";
        add_header X-PicoClaw-Proxy-Mode "primary-subfilter-v0.1.24" always;       
        add_header X-PicoClaw-Ingress-Path $http_x_ingress_path always;
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css;
        # Relative HTML assets inherit the browser's public Ingress origin.
        # Do not use X-Ingress-Path here: it may be empty in the proxy request.
        # Vite emits absolute /assets/*, /site.webmanifest, favicon etc.
        # A base element anchors every relative asset URL to the Ingress root,
        # including pages like /launcher-login and nested client routes.
        sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
        sub_filter 'src="/' 'src="';
        sub_filter 'href="/' 'href="';
        sub_filter 'url(/' 'url(';
        # Catch API URLs regardless of JS quoting, concatenation, or minification.
        sub_filter '/api/' 'api/';
        sub_filter '"/launcher-' '"$http_x_ingress_path/launcher-';
        sub_filter "'/launcher-" "'$http_x_ingress_path/launcher-";
        # JavaScript template literals can also contain absolute API paths.
        sub_filter '"/pico/' '"$http_x_ingress_path/pico/';
        sub_filter "'/pico/" "'$http_x_ingress_path/pico/";
        sub_filter '"/assets/' '"$http_x_ingress_path/assets/';
        sub_filter "'/assets/" "'$http_x_ingress_path/assets/";
    }
}
