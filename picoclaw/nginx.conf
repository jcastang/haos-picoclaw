server {
    listen 8099;
    server_name _;

    # Log to the Home Assistant add-on log stream.
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Home Assistant Supervisor's Ingress proxy is the only allowed client.
    allow 172.30.32.2;
    deny all;

    client_max_body_size 32m;

    # Ingress forwards the browser URL with /api/hassio_ingress/<token>
    # prepended. PicoClaw Launcher serves from /, so remove that prefix
    # before proxying the request upstream.
    location / {
        rewrite ^/api/hassio_ingress/[^/]+/?(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
