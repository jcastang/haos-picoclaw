map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8099;
    server_name _;
    access_log /dev/stdout;
    error_log /dev/stderr info;

    allow 172.30.32.2;
    deny all;
    client_max_body_size 32m;

    # Diagnostic endpoint served by NGINX itself, never forwarded to PicoClaw.
    location = /ingress-test.html {
        default_type text/html;
        alias /usr/share/nginx/html/ingress-test.html;
        add_header Cache-Control "no-store" always;
        add_header X-PicoClaw-Proxy-Test "nginx-direct" always;
    }

    location / {
        # Supervisor strips the Ingress URL prefix before forwarding.
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;
        proxy_cookie_path / "$http_x_ingress_path/";

        # Rewrite root-relative Launcher frontend URLs in uncompressed HTML/JS.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter '"/launcher-' '"$http_x_ingress_path/launcher-';
        sub_filter "'/launcher-" "'$http_x_ingress_path/launcher-";
        sub_filter '"/api/' '"$http_x_ingress_path/api/';
        sub_filter "'/api/" "'$http_x_ingress_path/api/";
        sub_filter '"/pico/' '"$http_x_ingress_path/pico/';
        sub_filter "'/pico/" "'$http_x_ingress_path/pico/";
        sub_filter '"/assets/' '"$http_x_ingress_path/assets/';
        sub_filter "'/assets/" "'$http_x_ingress_path/assets/';
    }
}
