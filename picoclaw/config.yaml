name: "PicoClaw"
version: "0.1.2"
slug: "picoclaw"
description: "PicoClaw Web Launcher, integrated into Home Assistant via Ingress"
url: "https://github.com/jcastang/haos-picoclaw"
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_panel: true
panel_title: "PicoClaw"
panel_icon: "mdi:robot"
ports:
  18800/tcp: null
ports_description:
  18800/tcp: "Launcher internal port (not exposed on the host)"
map:
  - type: data
    read_only: false
