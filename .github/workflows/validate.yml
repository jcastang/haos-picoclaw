name: Validate app
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install YAML validator
        run: python -m pip install pyyaml
      - name: Validate YAML files and Ingress configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (Path("repository.yaml"), Path("picoclaw/config.yaml"), Path("picoclaw/build.yaml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")

          config = yaml.safe_load(Path("picoclaw/config.yaml").read_text(encoding="utf-8"))
          build = yaml.safe_load(Path("picoclaw/build.yaml").read_text(encoding="utf-8"))
          dockerfile = Path("picoclaw/Dockerfile").read_text(encoding="utf-8")
          nginx = Path("picoclaw/nginx.conf").read_text(encoding="utf-8")
          assert config["version"] == build["args"]["BUILD_VERSION"], "config/build version mismatch"
          script = Path("picoclaw/run.sh").read_text()
          assert "nginx -t 2>&1" in script, "missing NGINX startup diagnostics"
          assert "-port 18800 -host 127.0.0.1" in script, "Launcher must bind to the NGINX upstream address"
          assert "FROM ghcr.io/sipeed/picoclaw:launcher" in dockerfile, "expected official Launcher image"
          assert f"ARG BUILD_VERSION={config['version']}" in dockerfile, "Dockerfile version mismatch"
          assert "proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;" in nginx, "missing Ingress Location rewrite"
          assert 'proxy_cookie_path / "$http_x_ingress_path/";' in nginx, "missing Ingress cookie scope"
          assert "PICOCLAW_REF" not in dockerfile, "obsolete source-build argument remains"
          assert "location = /ingress-test.html" in nginx, "missing direct NGINX test route"
          assert "COPY ingress-test.html /usr/share/nginx/html/ingress-test.html" in dockerfile, "missing diagnostic file in image"
          assert "NGINX OK - PicoClaw Ingress" in Path("picoclaw/ingress-test.html").read_text(), "missing diagnostic page"
          assert 'sub_filter_once off;' in nginx, "missing HTML/JS rewriting"
          assert 'proxy_set_header Accept-Encoding "";' in nginx, "missing uncompressed response"
          assert 'sub_filter_types application/javascript text/javascript;' in nginx, "missing JS rewriting"
          print("OK: version metadata and Ingress URL rewrites")
          PY
      - name: Validate NGINX syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp picoclaw/nginx.conf /etc/nginx/sites-enabled/default
          sudo nginx -t
      - name: Validate shell script syntax
        run: bash -n picoclaw/run.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 app image
        uses: docker/build-push-action@v6
        with:
          context: ./picoclaw
          platforms: linux/amd64
          push: false
          tags: haos-picoclaw:ci
          build-args: |
            BUILD_VERSION=0.1.14
            BUILD_ARCH=amd64
