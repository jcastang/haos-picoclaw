name: Validate app
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install YAML validator
        run: python -m pip install pyyaml
      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("repository.yaml"),
              Path("picoclaw/config.yaml"),
              Path("picoclaw/build.yaml"),
          ]
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"OK: {path}")

          config = yaml.safe_load(Path("picoclaw/config.yaml").read_text(encoding="utf-8"))
          build = yaml.safe_load(Path("picoclaw/build.yaml").read_text(encoding="utf-8"))
          dockerfile = Path("picoclaw/Dockerfile").read_text(encoding="utf-8")
          assert config["version"] == build["args"]["BUILD_VERSION"], "config/build version mismatch"
          assert "FROM ghcr.io/sipeed/picoclaw:launcher" in dockerfile, "expected official Launcher base image"
          assert "PICOCLAW_REF" not in dockerfile, "obsolete source-build argument remains"
          print(f"OK: add-on version {config['version']} is consistent")
          print("OK: Dockerfile uses the official upstream Launcher image")
          PY
      - name: Validate shell script syntax
        run: bash -n picoclaw/run.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 app image
        uses: docker/build-push-action@v6
        with:
          context: ./picoclaw
          platforms: linux/amd64
          push: false
          tags: haos-picoclaw:ci
          build-args: |
            BUILD_VERSION=0.1.9
            BUILD_ARCH=amd64
